<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker Trainer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brand" type="button" title="Naar het menu">
      <span class="suits"><span class="s-black">♠</span><span class="s-red">♥</span><span class="s-red">♦</span><span class="s-black">♣</span></span>
      Poker Trainer
    </button>
    <div class="topbar-info" id="table-info" hidden>
      <span class="pill" id="info-title"></span>
      <span class="pill" id="info-hand"></span>
      <span class="pill gold" id="info-level"></span>
      <span class="pill" id="info-model" title="Coachmethode voor starthanden"></span>
    </div>
    <div class="topbar-actions">
      <label class="speed" id="speed-control" hidden>
        <span>Tempo</span>
        <input type="range" id="speed" min="0.5" max="3" step="0.5" value="1">
        <span id="speed-label">1×</span>
      </label>
      <button class="btn ghost small" id="btn-voice" type="button" hidden title="Laat de croupier hardop spreken">🔇 Stem</button>
      <button class="btn ghost small" id="btn-home" type="button" hidden>Menu</button>
    </div>
  </header>

  <main id="app">
    <section id="screen-home" class="screen"></section>
    <section id="screen-lesson" class="screen" hidden></section>

    <section id="screen-table" class="screen" hidden>
      <div class="table-layout">
        <div class="table-area">
          <div class="felt-wrap" id="felt-wrap">
            <div class="felt">
              <div class="felt-logo">♠ ♥ ♦ ♣</div>
            </div>
            <!-- de croupier: een gestileerde figuur; haar rechterarm beweegt bij elke gedeelde kaart -->
            <svg class="croupier" id="croupier" viewBox="0 0 160 150" aria-hidden="true">
              <defs>
                <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#1c2028"/><stop offset="1" stop-color="#0d1015"/>
                </linearGradient>
              </defs>
              <path d="M50 66 C36 28 124 28 110 66 L116 104 L44 104 Z" fill="#3a1d12"/>
              <rect x="71" y="66" width="18" height="18" rx="7" fill="#e6b191"/>
              <path d="M34 150 C34 106 60 92 80 92 C100 92 126 106 126 150 Z" fill="url(#vest)"/>
              <path d="M64 92 L80 120 L96 92 Z" fill="#f7f3ea"/>
              <path d="M73 99 L80 103 L87 99 L87 108 L80 104 L73 108 Z" fill="#c62f28"/>
              <path d="M52 112 Q38 122 40 142" stroke="#12151b" stroke-width="13" stroke-linecap="round" fill="none"/>
              <circle cx="41" cy="143" r="7.5" fill="#efc1a3"/>
              <g class="croupier-arm" id="croupier-arm">
                <path d="M110 112 Q128 120 134 138" stroke="#12151b" stroke-width="13" stroke-linecap="round" fill="none"/>
                <circle class="croupier-hand" id="croupier-hand" cx="136" cy="140" r="7.5" fill="#efc1a3"/>
              </g>
              <ellipse cx="80" cy="50" rx="21" ry="25" fill="#f2c7a8"/>
              <path d="M58 48 C60 22 100 20 102 48 C96 34 84 32 80 40 C74 32 64 36 58 48 Z" fill="#4a2618"/>
              <path d="M66 46 Q71 42 77 45" stroke="#3a1d12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
              <path d="M83 45 Q89 42 94 46" stroke="#3a1d12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
              <ellipse cx="72" cy="52" rx="2.6" ry="3.2" fill="#26170f"/>
              <ellipse cx="88" cy="52" rx="2.6" ry="3.2" fill="#26170f"/>
              <circle cx="73" cy="51" r=".9" fill="#fff"/><circle cx="89" cy="51" r=".9" fill="#fff"/>
              <path d="M73 64 Q80 70 87 64 Q80 66.5 73 64 Z" fill="#c9424a"/>
              <circle cx="60" cy="60" r="2.2" fill="#e2b955"/><circle cx="100" cy="60" r="2.2" fill="#e2b955"/>
            </svg>
            <div class="speech" id="speech" hidden></div>
            <div class="deck-pile" id="deck-pile" title="Het kaartspel"><span></span><span></span><span></span></div>
            <div class="burn-pile" id="burn-pile" title="Burn cards"></div>
            <div class="fly-layer" id="fly-layer"></div>
            <div class="center">
              <div class="pot" id="pot" hidden></div>
              <div class="board" id="board"></div>
            </div>
            <div id="seats"></div>
          </div>

          <div class="action-bar" id="action-bar" hidden>
            <div class="situation">
              <div class="sit-street" id="sit-street">PREFLOP</div>
              <dl>
                <div><dt>Pot</dt><dd id="sit-pot">0</dd></div>
                <div><dt>Te callen</dt><dd id="sit-call">0</dd></div>
                <div><dt>Pot odds</dt><dd id="sit-odds">–</dd></div>
                <div><dt>Positie</dt><dd id="sit-pos">–</dd></div>
              </dl>
            </div>
            <div class="raise-box" id="raise-box" hidden>
              <div class="raise-row">
                <input type="range" id="raise-slider" min="0" max="100" step="1" value="0">
                <input type="number" id="raise-input" min="0" max="100" step="1" value="0">
              </div>
              <div class="raise-presets" id="raise-presets"></div>
            </div>
            <div class="action-buttons" id="action-buttons"></div>
          </div>
          <div class="waiting" id="waiting" hidden>
            <span class="dot"></span> De bots zijn aan zet …
          </div>
        </div>

        <aside class="sidebar">
          <div class="panel coach-panel">
            <h3>🎓 Coach</h3>
            <div class="body" id="coach-body"></div>
            <div class="panel-foot">
              <button class="btn coach" id="btn-advice" type="button" disabled>Vraag advies</button>
              <span class="hint">sneltoets <kbd>?</kbd></span>
            </div>
          </div>
          <div class="panel log-panel">
            <h3>Verloop</h3>
            <div class="body log" id="log-body"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <div id="overlay" class="overlay" hidden><div class="overlay-card" id="overlay-card"></div></div>

  <script src="/static/app.js"></script>
</body>
</html>
